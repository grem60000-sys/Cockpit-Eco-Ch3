<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cockpit éco · Chapitre 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>/* Concept : salle de contrôle d'une économie — panneaux d'instruments sur fond nuit marine,
   signaux ambre (décision), cyan (flux), corail (alerte), vert (objectif atteint). Un seul univers sombre, assumé. */
:root{
  --ink:#08111F; --deck:#0E1A2E; --panel:#13223B; --panel2:#1A2C4A; --line:#26395C; --line2:#34507E;
  --txt:#E7EDF6; --mute:#9AAAC3; --dim:#6F82A3;
  --amber:#F3B33D; --cyan:#4CC9E2; --coral:#FF6F61; --green:#3FD69A; --violet:#A99BFF;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"DejaVu Sans Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--txt);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp)}
.kick{font-family:var(--f-disp);font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:.6em 1.2em;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1B1405}
.btn.pri:hover{background:#FFC556}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:.4em .9em;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],textarea{font:inherit;color:var(--txt);background:var(--deck);border:1.5px solid var(--line2);border-radius:10px;padding:.6em .8em;min-height:48px;width:100%}
input[type=range]{width:100%;accent-color:var(--amber);min-height:44px}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.2em .7em;border-radius:99px;border:1px solid var(--line2);font-size:.82rem;color:var(--mute)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.chip.on .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.off .dot{background:var(--coral)}

/* ---------------- Accueil ---------------- */
#home{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.home-in{max-width:1100px;width:100%}
.home-in h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin:.3em 0 .25em;text-wrap:balance}
.home-in .tag{font-size:clamp(1.05rem,2vw,1.3rem);color:var(--mute);max-width:46ch}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px}
.mode{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:190px;transition:border-color .2s,transform .2s}
.mode:hover{border-color:var(--amber);transform:translateY(-2px)}
.mode b{font-family:var(--f-disp);font-size:1.35rem}
.mode .who{font-family:var(--f-data);font-size:.75rem;color:var(--cyan);letter-spacing:.08em;text-transform:uppercase}
.mode p{margin:0;color:var(--mute);font-size:.95rem}
.home-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35;pointer-events:none}
.home-in{position:relative;z-index:1}
@media (max-width:820px){.modes{grid-template-columns:1fr}.mode{min-height:0}.home-canvas{opacity:.12}}

/* ---------------- Présentation ---------------- */
#present{position:fixed;inset:0;background:var(--ink);overflow:hidden}
#pFrame{position:absolute;left:0;top:0;width:1600px;height:900px;display:grid;grid-template-rows:auto 1fr auto;transform-origin:0 0}
.p-top{display:flex;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--deck)}
.p-top .where{font-family:var(--f-disp);font-weight:600;letter-spacing:.06em;font-size:.9rem;color:var(--mute);text-transform:uppercase}
.p-top .where b{color:var(--amber);font-weight:700}
.p-top .sp{flex:1}
.prog{display:flex;gap:4px}
.prog i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--line2)}
.prog i.cur{background:var(--amber)}
.stage{position:relative;overflow:hidden;min-height:0}
.scene{position:absolute;inset:0;padding:18px 36px 16px;display:grid;grid-template-rows:auto 1fr;gap:12px;animation:sceneIn .5s ease}
@keyframes sceneIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scene h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.5rem,2.7vw,2.4rem);margin:0;line-height:1.1;text-wrap:balance}
.scene .lead{color:var(--mute);font-size:clamp(1rem,1.5vw,1.25rem);margin:.35em 0 0;max-width:70ch}
.body{min-height:0;display:grid;gap:18px}
.cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;min-height:0;position:relative}
.panel h3{margin:0 0 10px;font-family:var(--f-disp);font-size:1.05rem;letter-spacing:.04em;color:var(--cyan);text-transform:uppercase}
.panel canvas,.panel svg{display:block;width:100%;height:100%}
.cvw{position:relative;min-height:240px;height:100%;flex:1}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%}
.stack{display:flex;flex-direction:column;gap:14px;min-height:0}
.stack>*{flex-shrink:0}
.scene .panel{overflow:auto}
.scene .panel.fill{overflow:hidden}
.meter{display:grid;grid-template-columns:150px minmax(0,1fr) 80px;gap:10px;align-items:center}
.meter .track{height:26px;background:var(--deck);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex}
.meter .seg-b{height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lever{position:absolute;top:0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--amber);background:#2A230F;font-family:var(--f-disp);font-weight:600;transition:left 1.2s cubic-bezier(.6,0,.2,1),top 1.2s cubic-bezier(.6,0,.2,1);white-space:nowrap}
.lever.cage{border-color:var(--coral);background:#3A1F28}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.fill{display:flex;flex-direction:column;min-height:0}
.fill>.grow{flex:1;min-height:0;position:relative}
.p-bot{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line);background:var(--deck);flex-wrap:wrap}
.p-bot .sp{flex:1}
.notes{position:absolute;right:18px;bottom:18px;width:min(460px,90%);background:#0B1528F2;border:1px solid var(--amber);border-radius:14px;padding:14px 16px;z-index:30;font-size:.95rem;box-shadow:0 20px 50px #0009}
.notes b{color:var(--amber)}
.defn{border-left:4px solid var(--amber);background:var(--panel2);border-radius:0 12px 12px 0;padding:12px 14px;font-size:1.02rem}
.defn b{color:var(--amber);font-family:var(--f-disp);letter-spacing:.03em}
.big-num{font-family:var(--f-data);font-size:clamp(2rem,4vw,3.4rem);font-weight:700;line-height:1;color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-family:var(--f-data);font-size:1.6rem;font-weight:700}
.kpi.good .v{color:var(--green)}.kpi.bad .v{color:var(--coral)}.kpi.warn .v{color:var(--amber)}
.reveal{opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.reveal.show{opacity:1;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden}
.seg button{min-height:46px;padding:.4em 1em;background:transparent;border:none;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--amber);color:#1B1405}

/* Sondage en direct */
.poll{display:grid;gap:8px}
.poll .pq{font-family:var(--f-disp);font-size:clamp(1.1rem,2vw,1.5rem);font-weight:600;text-wrap:balance}
.opt-bar{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--deck);border:1.5px solid var(--line);border-radius:12px;padding:5px 10px;position:relative;overflow:hidden}
.opt-bar .fillbar{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#4CC9E233,#4CC9E211);transition:width .5s}
.opt-bar.right{border-color:var(--green)}
.opt-bar.right .fillbar{background:linear-gradient(90deg,#3FD69A55,#3FD69A11)}
.opt-bar>*{position:relative}
.opt-bar .L{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);font-family:var(--f-disp);font-weight:700}
.opt-bar .n{font-family:var(--f-data);font-weight:700;min-width:5ch;text-align:right}
.opt-bar .adj{display:none;gap:4px}
.salle .opt-bar .adj{display:inline-flex}
.adj button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:700}
.poll-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vcount{font-family:var(--f-data);color:var(--cyan)}

/* Rejoindre (QR) */
.join-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.qr{background:#fff;padding:10px;border-radius:12px;width:200px;height:200px;display:grid;place-items:center}
.qr img,.qr canvas{width:100%!important;height:auto!important}
.code{font-family:var(--f-data);font-size:clamp(2.4rem,5vw,4rem);font-weight:700;letter-spacing:.2em;color:var(--amber)}

/* Domino BCE */
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dom{background:var(--deck);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.9rem;min-height:84px;display:flex;flex-direction:column;gap:6px;transition:border-color .3s,background .3s,transform .3s}
.dom .m{font-family:var(--f-data);font-size:.78rem;color:var(--dim)}
.dom.on{border-color:var(--amber);background:#2A230F;transform:translateY(-4px)}
.dom.on .m{color:var(--amber)}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1.4;border-radius:8px;display:grid;place-items:center;font-family:var(--f-data);font-size:.72rem;background:var(--deck);border:1px solid var(--line);transition:background .4s}
.tile.hot{background:#3A1F28;border-color:var(--coral)}
.tile.ok{background:#123628;border-color:var(--green)}
.tile.cold{background:#13304A;border-color:var(--cyan)}

/* Arène / matrice 2x2 */
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);gap:8px;height:100%}
.mat .hd{font-family:var(--f-disp);font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;display:grid;place-items:center;text-align:center}
.mat .hd.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.cell{background:var(--deck);border:1.5px dashed var(--line2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;transition:border-color .3s,background .3s}
.cell.lit{border-style:solid;border-color:var(--amber);background:#221D10}
.cell .ct{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.cell .pct{font-family:var(--f-data);font-size:1.5rem;font-weight:700;color:var(--cyan)}
.card-m{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:.92rem;animation:sceneIn .4s}
.measure{font-family:var(--f-disp);font-size:clamp(1.2rem,2.4vw,1.9rem);font-weight:600;text-wrap:balance}

/* Mur des phrases */
.wall{columns:3 260px;column-gap:12px}
.ph{break-inside:avoid;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:1rem;animation:sceneIn .4s;cursor:pointer}
.ph:hover{border-color:var(--coral)}

/* ---------------- Élève ---------------- */
#student{min-height:100%;padding:20px 16px 40px;max-width:640px;margin:0 auto}
.s-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.s-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.s-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:58px;padding:10px 14px;margin:8px 0;border-radius:12px;border:1.5px solid var(--line2);background:var(--deck);cursor:pointer;font-size:1.02rem}
.s-opt .L{width:34px;height:34px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-family:var(--f-disp);font-weight:700}
.s-opt[aria-pressed=true]{border-color:var(--amber);background:#2A230F}
.s-opt[aria-pressed=true] .L{background:var(--amber);color:#1B1405}
.wait{display:grid;place-items:center;text-align:center;gap:10px;padding:30px 10px}
.pulse{width:16px;height:16px;border-radius:50%;background:var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #4CC9E288}100%{box-shadow:0 0 0 22px #4CC9E200}}

/* ---------------- Révision ---------------- */
#revise{min-height:100%}
.r-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--deck);border-bottom:1px solid var(--line);flex-wrap:wrap}
.r-top .sp{flex:1}
.r-wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.r-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center;margin-bottom:22px}
.r-hero h1{font-family:var(--f-disp);font-size:clamp(1.7rem,4vw,2.8rem);margin:.2em 0;line-height:1.08;text-wrap:balance}
.gauge-big{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:170px;transition:border-color .2s,transform .2s}
.mod:hover{border-color:var(--cyan);transform:translateY(-2px)}
.mod .n{font-family:var(--f-data);color:var(--cyan);font-size:.8rem;letter-spacing:.1em}
.mod b{font-family:var(--f-disp);font-size:1.15rem;line-height:1.2}
.mod p{margin:0;color:var(--mute);font-size:.92rem;flex:1}
.mod .st{display:flex;gap:6px}
.mod .st span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.mod .st span.ok{background:var(--green)}
.mod.special{border-color:var(--amber)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{min-height:46px;padding:.4em 1em;border-radius:10px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--cyan);border-color:var(--cyan);color:#05202A}
.sim-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:440px;display:grid}
.sim-box>.scene{position:relative;inset:auto;padding:0;animation:none}
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.flip{perspective:900px;min-height:170px;cursor:pointer;border:none;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.flip .f{background:var(--panel2);border:1.5px solid var(--line2)}
.flip .f b{font-family:var(--f-disp);font-size:1.15rem}
.flip .b{background:#1E2A1A;border:1.5px solid var(--green);transform:rotateY(180deg);font-size:.95rem}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:8px}
.q label{display:flex;gap:10px;align-items:center;min-height:48px;padding:8px 12px;border:1.5px solid var(--line2);border-radius:10px;margin:6px 0;cursor:pointer;background:var(--deck)}
.q label:has(input:checked){border-color:var(--amber)}
.q input[type=radio]{width:20px;height:20px;accent-color:var(--amber)}
.q label.good{border-color:var(--green);background:#123628}
.q label.bad{border-color:var(--coral);background:#3A1F28}
.q .ex{display:none;margin-top:8px;font-size:.92rem;color:var(--mute);border-left:3px solid var(--cyan);padding-left:10px}
.q.done .ex{display:block}
.res{font-weight:700;min-height:1.4em;margin-top:8px}
.res.ok{color:var(--green)}.res.ko{color:var(--coral)}
.sort-row{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sort-row select{min-height:48px;font:inherit;color:var(--txt);background:var(--deck);border:1.5px solid var(--line2);border-radius:10px;padding:0 10px;width:100%}
.calc{padding:10px 0;border-top:1px solid var(--line)}
.calc .in{display:flex;gap:8px;align-items:center;max-width:320px;margin-top:6px}
.calc .co{display:none;font-size:.92rem;color:var(--mute);margin-top:6px}
.calc.done .co{display:block}
.vf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ess{background:var(--panel2);border-radius:12px;padding:14px;border:1px solid var(--line2)}
.ess h4{margin:0 0 6px;font-family:var(--f-disp);color:var(--amber)}
.ess ul{margin:0;padding-left:20px}
.ess li{margin:4px 0}

@media (max-width:980px){
  .scene{position:relative;inset:auto;padding:18px 16px}
  #present{position:static;overflow:visible}
  #pFrame{position:static;width:auto;height:auto;display:block;transform:none!important}
  .stage{overflow:visible}
  .cols,.cols.even{grid-template-columns:1fr}
  .chain{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr))}
  .r-hero{grid-template-columns:1fr}
  .join-box{grid-template-columns:1fr}
  .sort-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =================================================================== V2 : gabarit de scène */
body{background:radial-gradient(1200px 700px at 85% -10%,#173158 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#13294A 0%,transparent 55%),var(--ink);background-attachment:fixed}
#present{background:radial-gradient(1100px 650px at 80% -15%,#16305A 0%,transparent 60%),var(--ink)}
.sc2{position:absolute;inset:0;padding:16px 28px 14px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;animation:sceneIn .5s ease;--pc:var(--amber)}
.sc2[data-p="1"]{--pc:var(--cyan)}.sc2[data-p="2"]{--pc:var(--amber)}.sc2[data-p="3"]{--pc:var(--violet)}.sc2[data-p="4"]{--pc:var(--green)}
.sc2 .hd2{display:flex;align-items:flex-end;gap:20px}
.sc2 .hd2 .tt{flex:1;min-width:0}
.sc2 .kick{color:var(--pc)}
.sc2 h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.5rem,2.6vw,2.3rem);margin:.1em 0 0;line-height:1.08;text-wrap:balance}
.sc2 .qq{color:var(--mute);font-size:1.08rem;margin:.25em 0 0}
.sc2 .qq b{color:var(--txt);font-weight:600}
.main2{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:16px;min-height:0}
.vis{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,#14243F 0%,#0F1C33 100%);box-shadow:0 20px 50px #0006, inset 0 1px 0 #ffffff0d;overflow:hidden}
.vis-head{display:flex;align-items:center;gap:10px;padding:12px 16px 0;flex-wrap:wrap}
.vis-head .vt{font-family:var(--f-disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pc);font-size:.88rem;flex:1}
.vis-body{flex:1;min-height:0;position:relative;padding:10px 16px}
.vis-foot{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);background:#0B1629B0}
.stepn{font-family:var(--f-data);font-weight:700;color:#08111F;background:var(--pc);border-radius:10px;padding:4px 10px;white-space:nowrap}
.stept{flex:1;font-family:var(--f-disp);font-weight:600;font-size:1.05rem;min-width:0}
.dots{display:flex;gap:5px}.dots i{width:22px;height:6px;border-radius:3px;background:var(--line2);transition:background .3s}.dots i.on{background:var(--pc)}.dots i.done{background:color-mix(in srgb,var(--pc) 45%,transparent)}
.stepbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:700;font-size:1.1rem}
.stepbtn:hover{border-color:var(--pc)}
.qbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:.3em .9em;border-radius:99px;border:1.5px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--txt);cursor:pointer;font-weight:700}
.qbtn .pip{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc)}
.qbtn.live .pip{animation:pulse 1.4s infinite}

/* Fiche de cours */
.cours{display:flex;flex-direction:column;min-height:0;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,#152641,#101D34);overflow:hidden}
.cours-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cours-h b{font-family:var(--f-disp);letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--pc);flex:1}
.cours-b{flex:1;overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ntags{display:flex;flex-wrap:wrap;gap:6px}
.ntag{font-size:.78rem;padding:3px 9px;border-radius:99px;border:1px dashed var(--line2);color:var(--dim)}
.ntag.on{border-style:solid;border-color:var(--pc);color:var(--txt);background:color-mix(in srgb,var(--pc) 15%,transparent)}
.dcard{border-radius:14px;padding:10px 12px;background:#0B1629;border:1px solid var(--line);border-left:4px solid var(--pc);animation:pop .5s ease}
.dcard .dt{font-family:var(--f-disp);font-weight:700;color:var(--pc);font-size:1rem;display:flex;align-items:center;gap:8px}
.dcard .dt .off{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--pc);color:#08111F}
.dcard .dd{font-size:.93rem;margin-top:3px;line-height:1.4}
.dcard.new{box-shadow:0 0 0 2px var(--pc),0 0 24px color-mix(in srgb,var(--pc) 40%,transparent)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:st}
.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:6px 8px;border-radius:12px;color:var(--dim);transition:background .3s,color .3s;cursor:pointer}
.st .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-weight:700;font-size:.85rem;border:1.5px solid var(--line2)}
.st .t{font-family:var(--f-disp);font-weight:600;padding-top:3px}
.st .d{grid-column:2;font-size:.95rem;line-height:1.45;color:var(--txt);display:none}
.st.done{color:var(--mute)}.st.done .n{background:color-mix(in srgb,var(--pc) 30%,transparent);border-color:var(--pc);color:var(--txt)}
.st.cur{background:color-mix(in srgb,var(--pc) 10%,transparent);color:var(--txt)}
.st.cur .n{background:var(--pc);border-color:var(--pc);color:#08111F}
.st.cur .d{display:block;animation:pop .4s}
.exb{border-radius:12px;padding:10px 12px;background:#0B1629;border:1px solid var(--line);font-size:.92rem}
.exb .l{font-family:var(--f-disp);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.ret{border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 22%,#0B1629),#0B1629);border:1.5px solid var(--pc);animation:pop .5s}
.ret .l{font-family:var(--f-disp);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pc)}
.ret p{margin:.3em 0 0;font-size:1rem;line-height:1.45}
.sec-l{font-family:var(--f-disp);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

/* Question en surimpression */
.qover{position:absolute;inset:0;z-index:40;background:#050B16CC;backdrop-filter:blur(6px);display:grid;place-items:center;animation:sceneIn .3s}
.qcard{width:min(980px,92%);max-height:92%;overflow:auto;border-radius:22px;border:1.5px solid var(--pc,var(--amber));background:linear-gradient(180deg,#172947,#111F37);padding:22px 26px;box-shadow:0 30px 80px #000a}
.qcard .poll .pq{font-size:1.7rem}
.qcard .opt-bar{padding:10px 12px;font-size:1.15rem}
.qcard .x{float:right}
.expl{margin-top:10px;border-left:4px solid var(--green);background:#123628;border-radius:0 12px 12px 0;padding:10px 12px}

/* Carte des notions */
.nmap text{font-family:"Chakra Petch",sans-serif}
.nnode rect{transition:fill .5s,stroke .5s,opacity .5s}
.nnode{cursor:pointer}
.nedge{transition:opacity .6s}

/* Barre du haut : compteur de notions */
.nchip{display:inline-flex;align-items:center;gap:8px;padding:.25em .8em;border-radius:99px;border:1px solid var(--line2);font-size:.85rem}
.nchip .bar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.nchip .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber),var(--violet),var(--green));transition:width .6s}

/* Défi 2026 (ouverture) */
.kbig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kb{border-radius:16px;padding:14px;background:#0B1629;border:1px solid var(--line)}
.kb .l{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.kb .v{font-family:var(--f-data);font-size:2.4rem;font-weight:700;line-height:1.1}
.kb .s{font-size:.82rem;color:var(--dim)}
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rt{border-radius:16px;padding:14px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#0B1629);animation:pop .5s backwards}
.rt .n{font-family:var(--f-data);font-size:1.8rem;font-weight:700;color:var(--c)}
.rt b{font-family:var(--f-disp);display:block;font-size:1.05rem;margin:.2em 0}
.rt span{font-size:.85rem;color:var(--mute)}

/* Thermomètre BCE */
.thermo{display:grid;grid-template-columns:80px minmax(0,1fr);gap:18px;align-items:end;height:100%}
.tube{position:relative;width:46px;margin:0 auto;height:100%;max-height:300px;border-radius:24px;border:2px solid var(--line2);background:#0B1629;overflow:hidden}
.tube i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--coral),#FF9F7A);transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.tube .tg{position:absolute;left:-6px;right:-6px;height:2px;background:var(--green);box-shadow:0 0 8px var(--green)}

/* Tuiles concurrence */
.ctiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;height:100%}
.ctile{border-radius:16px;padding:14px;border:1.5px solid var(--line);background:#0B1629;opacity:.35;transition:opacity .5s,border-color .5s,transform .5s;display:flex;flex-direction:column;gap:6px}
.ctile.on{opacity:1;border-color:var(--violet);transform:translateY(-3px)}
.ctile .ic{font-family:var(--f-disp);font-size:1.25rem;font-weight:700;color:var(--violet)}
.ctile .case{margin-top:auto;font-size:.88rem;border-top:1px dashed var(--line2);padding-top:6px;color:var(--mute)}
.ctile .amt{font-family:var(--f-data);font-size:1.5rem;font-weight:700;color:var(--amber)}

@media (max-width:980px){
  .sc2{position:relative;inset:auto;padding:14px 12px}
  .main2{grid-template-columns:1fr}
  .vis-body{min-height:380px}
  .kbig,.route{grid-template-columns:1fr 1fr}
  .ctiles{grid-template-columns:1fr}
}
.prog i{background:var(--line)}
.prog i.done{background:color-mix(in srgb,var(--c,var(--amber)) 45%,transparent)}
.prog i.cur{background:var(--c,var(--amber));box-shadow:0 0 8px var(--c,var(--amber))}
.sim-box{padding:0;background:transparent;border:none;min-height:0;display:block}
.sim-box .sc2{position:relative;inset:auto;height:min(860px,calc(100vh - 120px));min-height:680px;padding:0}
.mod.special{border-color:var(--line2)}
#student .st{display:grid}
@media (max-width:980px){.sim-box .sc2{height:auto;min-height:0}}
.dmini{border-radius:12px;background:#0B1629;border:1px solid var(--line);border-left:4px solid var(--pc)}
.dmini summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;font-family:var(--f-disp);font-weight:700;color:var(--pc)}
.dmini summary::-webkit-details-marker{display:none}
.dmini summary::after{content:"+";margin-left:auto;color:var(--mute);font-family:var(--f-data)}
.dmini[open] summary::after{content:"−"}
.dmini .off{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--pc);color:#08111F}
.dmini .dd{padding:0 12px 10px;font-size:.93rem;line-height:1.4}
@media (max-width:980px){
  .vis-body>div[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .vis-foot .dots{display:none}
  .stept{font-size:.95rem}
  .cvw{min-height:300px}
  .chain{grid-template-columns:1fr 1fr}
  .mat{min-height:420px}
  .tube{height:220px;flex:none!important}
  .js-map{min-height:280px}
}

/* =================================================================== V3 */
/* Fil d'Ariane du plan */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.92rem;color:var(--mute)}
.crumb .cr{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);background:#0B1629}
.crumb .cr b{font-family:var(--f-data);color:var(--pc)}
.crumb .cr.last{border-color:var(--pc);color:var(--txt);background:color-mix(in srgb,var(--pc) 16%,#0B1629);font-weight:600}
.crumb .sep{color:var(--dim);font-style:normal}
.crumb.small{font-size:.8rem;color:var(--pc);font-family:var(--f-disp);font-weight:600}
/* Trace écrite */
.cours-h b{font-size:.95rem}
.tlab{font-family:var(--f-disp);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pc);display:flex;align-items:center;gap:8px;margin-top:2px}
.tlab::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--pc) 40%,transparent)}
.planrow{font-size:1.05rem;padding:8px 12px;border-radius:12px;background:#0B1629;border:1px solid var(--line)}
.planrow b{color:var(--pc);font-family:var(--f-data)}
/* Page de partie */
.partcard{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center;padding:10px 30px;background:radial-gradient(600px 400px at 20% 50%,color-mix(in srgb,var(--pc) 22%,transparent),transparent 70%)}
.pnum{font-family:var(--f-disp);font-weight:700;font-size:clamp(7rem,14vw,13rem);line-height:.8;color:transparent;-webkit-text-stroke:3px var(--pc);text-shadow:0 0 50px color-mix(in srgb,var(--pc) 60%,transparent);animation:pop .8s}
.pbody h3{font-family:var(--f-disp);font-size:clamp(1.6rem,2.6vw,2.4rem);margin:.15em 0 .5em;line-height:1.1;text-wrap:balance}
.psecs{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.psecs li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:#0B1629CC;border:1px solid var(--line);border-left:5px solid var(--pc);font-size:1.15rem;animation:pop .5s backwards}
.psecs b{font-family:var(--f-data);color:var(--pc);font-size:1.2rem}
/* Repères numérotés */
.callouts{position:absolute;inset:0;pointer-events:none;z-index:6}
.co{position:absolute;width:0;height:0;animation:pop .5s backwards}
.co .pin{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:#08111F;font-family:var(--f-data);font-weight:700;box-shadow:0 0 0 6px color-mix(in srgb,var(--pc) 25%,transparent),0 0 22px var(--pc);animation:pinp 2.2s infinite}
@keyframes pinp{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 30%,transparent),0 0 16px var(--pc)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--pc) 10%,transparent),0 0 26px var(--pc)}}
.co .cc{position:absolute;width:max-content;max-width:250px;padding:8px 12px;border-radius:12px;background:#08111FF0;border:1.5px solid var(--pc);font-size:.92rem;line-height:1.35;font-weight:600;box-shadow:0 10px 30px #0008}
.co-r .cc{left:24px;top:0;transform:translateY(-50%)}
.co-l .cc{right:24px;top:0;transform:translateY(-50%)}
.co-t .cc{left:0;bottom:24px;transform:translateX(-50%)}
.co-b .cc{left:0;top:24px;transform:translateX(-50%)}
.tgl{min-height:36px;padding:.2em .8em;border-radius:99px;border:1.5px solid var(--line2);background:transparent;color:var(--mute);cursor:pointer;font-weight:600;font-size:.85rem}
.tgl[aria-pressed=true]{border-color:var(--pc);color:var(--txt)}
/* Bouton « la classe joue » */
.qbtn.play{background:var(--pc);color:#08111F;border-color:var(--pc)}
.qbtn.play .pip{background:#08111F;box-shadow:none}
.qbtn.play.hint{animation:hintp 1.6s infinite}
@keyframes hintp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 60%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--pc) 0%,transparent)}}
.qbtn.live .pip{animation:pulse 1.2s infinite}
/* Barre de pilotage */
.playbar{border-top:1px solid var(--pc);background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 14%,#0B1629),#0B1629);padding:10px 14px;display:flex;flex-direction:column;gap:8px;animation:pop .35s}
.pb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pb-q{flex:1;min-width:0;font-family:var(--f-disp);font-size:1.08rem}
.pb-man{font-size:.85rem}.pb-man .btn{min-height:36px;padding:.2em .6em}
.pm-it{display:inline-flex;gap:4px;align-items:center;margin-right:8px}
.pb-in .s-opt{min-height:48px}
/* Résultats de la classe (superposition) */
.pres{position:absolute;right:14px;bottom:12px;width:min(470px,58%);max-height:calc(100% - 24px);overflow:auto;z-index:8;background:#08111FF2;border:1.5px solid var(--pc);border-radius:16px;padding:12px 14px;box-shadow:0 20px 50px #000a;animation:pop .4s;display:flex;flex-direction:column;gap:8px}
.pres.min{max-height:46px;overflow:hidden}
.pres-x{position:absolute;right:8px;top:6px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;color:var(--txt)}
.rbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:.92rem}
.rbar .rt{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.rbar .rt i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .6s}
.rbar.ok span{color:var(--green);font-weight:700}.rbar.ok .rt i{background:var(--green)}
.rbar b{font-family:var(--f-data);text-align:right}
.ritem .rq{font-size:.9rem;margin-bottom:4px}
.rstack{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px}
.rstack span{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#08111F;white-space:nowrap;overflow:hidden;transition:flex .6s;background:hsl(calc(190 + var(--k) * 55) 70% 62%)}
.rstack span.ok{background:var(--green)}.rstack span.ko{background:#4A5873;color:var(--txt)}
.rans{font-size:.82rem;color:var(--green);margin-top:3px}
.hist{position:relative;height:120px;display:flex;align-items:flex-end;gap:3px;margin-top:22px;border-bottom:1px solid var(--line2)}
.hist i{flex:1;background:linear-gradient(0deg,var(--violet),#C9BEFF);border-radius:4px 4px 0 0;transition:height .6s;min-height:2px}
.hm,.ha{position:absolute;top:-6px;bottom:0;width:2px}
.hm{background:var(--violet)}.ha{background:var(--green);box-shadow:0 0 10px var(--green)}
.hm em,.ha em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:.75rem;font-weight:700;font-family:var(--f-data)}
.hm em{color:var(--violet)}.ha em{color:var(--green);top:-34px}
.hax{display:flex;justify-content:space-between;font-size:.75rem;color:var(--dim);font-family:var(--f-data)}
.mixpct{margin-top:auto;font-family:var(--f-data);font-weight:700;color:var(--violet);font-size:1.3rem}
.tile small{display:block;font-size:.62rem;font-family:var(--f-body)}
/* Élève */
.stabs{display:flex;gap:6px;margin-bottom:12px}
.stabs button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line2);background:transparent;color:var(--mute);font-weight:700;cursor:pointer}
.stabs button[aria-selected=true]{background:var(--amber);border-color:var(--amber);color:#1B1405}
.stabs .pip{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--coral);vertical-align:1px;animation:pulse 1.2s infinite}
.play-card{box-shadow:0 0 0 1px var(--pc),0 10px 30px color-mix(in srgb,var(--pc) 25%,transparent)}
.sitem{padding:10px 0;border-top:1px solid var(--line)}.sitem:first-child{border-top:none}
.sq{font-size:.98rem;margin-bottom:6px}
.sopts{display:flex;gap:6px;flex-wrap:wrap}
.sopts button{flex:1 1 auto;min-height:44px;padding:.3em .7em;border-radius:10px;border:1.5px solid var(--line2);background:var(--deck);color:var(--txt);cursor:pointer;font-weight:600;font-size:.9rem}
.sopts button[aria-pressed=true]{background:var(--pc,var(--amber));border-color:var(--pc,var(--amber));color:#08111F}
.est{display:grid;gap:8px}.estv{font-family:var(--f-data);font-size:2.4rem;text-align:center;color:var(--pc,var(--amber))}
.role{border-radius:14px;padding:12px;background:#0B1629;border:1.5px dashed var(--pc,var(--amber));display:grid;gap:4px;margin-bottom:8px}
.role b{font-family:var(--f-disp);font-size:1.2rem}
.fb{font-size:.9rem;padding:4px 0}.fb.ok{color:var(--green)}.fb.ko{color:var(--coral)}
.mcourse{display:grid;gap:8px}
.mc-p{font-family:var(--f-disp);font-size:1.15rem;margin:10px 0 0;color:var(--pc,var(--amber));border-bottom:2px solid var(--pc,var(--amber));padding-bottom:4px}
.mc-s{font-family:var(--f-disp);font-size:1rem;margin:6px 0 0;color:var(--txt)}
.mc-i{padding-left:10px;border-left:3px solid var(--pc)}
.mc-t{font-weight:700;font-size:.98rem}
@media (max-width:980px){.pres{position:relative;right:auto;bottom:auto;width:100%;margin-top:10px}.partcard{grid-template-columns:1fr;gap:10px}.co .cc{max-width:170px;font-size:.8rem}}

.p-top .where{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.cours .dcard .dd{font-size:.9rem}
.vis-body{overflow:hidden}
.t21 .tile{aspect-ratio:auto}
details.pb-man summary{cursor:pointer;color:var(--mute);font-size:.82rem;min-height:30px;display:flex;align-items:center}

: quand l'activité s'emballe et que les prix accélèrent, on freine la demande. Les trois autres mesures relancent la demande : elles seraient procycliques.", "m": "m1"}, {"q": "Les stabilisateurs automatiques désignent :", "o": ["les variations spontanées des recettes et des dépenses publiques selon la conjoncture", "les plans de relance votés par le Parlement lorsque l'activité recule fortement", "les règles européennes qui plafonnent le déficit public des États membres à 3 % du PIB", "les hausses de taux directeurs décidées par la BCE pour contenir l'inflation"], "e": "En récession, les recettes fiscales baissent et les allocations chômage augmentent sans décision nouvelle : le déficit se creuse et soutient les revenus. Un plan de relance est au contraire une politique discrétionnaire.", "m": "m2"}, {"q": "L'effet multiplicateur signifie qu'une hausse des dépenses publiques :", "o": ["entraîne une hausse de la production supérieure à son montant initial", "entraîne une hausse équivalente des recettes fiscales de l'État", "multiplie le montant de la dette publique par le taux d'intérêt", "provoque une hausse des prix proportionnelle à la dépense engagée"], "e": "La dépense initiale crée des revenus, qui sont en partie consommés, ce qui crée de nouveaux débouchés et de nouveaux revenus : l'effet final sur la production dépasse la dépense de départ.", "m": "m2"}, {"q": "L'objectif principal assigné à la BCE par les traités est :", "o": ["la stabilité des prix, soit une inflation de 2 % à moyen terme", "le plein emploi, mesuré par un taux de chômage inférieur à 5 %", "l'équilibre des budgets publics de chacun des États de la zone euro", "la stabilité du taux de change de l'euro face aux autres monnaies"], "e": "Le mandat de la BCE est la stabilité des prix, définie depuis 2021 comme une inflation de 2 % à moyen terme. Elle ne fixe ni le budget des États ni un objectif de chômage.", "m": "m3"}, {"q": "Pour freiner l'inflation, la BCE :", "o": ["relève ses taux directeurs afin de rendre le crédit plus cher", "abaisse ses taux directeurs afin de stimuler l'épargne des ménages", "augmente ses achats de titres pour réduire la masse monétaire", "fixe un plafond aux hausses de prix pratiquées par les entreprises"], "e": "Une hausse des taux renchérit le crédit : ménages et entreprises empruntent et dépensent moins, la demande ralentit, les hausses de prix aussi. Les achats de titres produisent l'effet inverse, et la BCE ne fixe aucun prix.", "m": "m3"}, {"q": "Une hausse des taux directeurs se transmet d'abord :", "o": ["aux taux des crédits accordés par les banques commerciales", "aux prix de l'énergie importée par la zone euro", "aux salaires fixés par les conventions collectives", "aux impôts payés par les ménages et les entreprises"], "e": "La première étape de la transmission est bancaire : les banques, qui se refinancent plus cher, relèvent les taux de leurs crédits. Les effets sur la demande puis sur les prix viennent ensuite.", "m": "m3"}, {"q": "Une baisse pérenne de l'impôt sur les sociétés est une politique :", "o": ["d'offre et structurelle", "de demande et structurelle", "d'offre et conjoncturelle", "de demande et conjoncturelle"], "e": "Elle améliore la rentabilité des entreprises (offre) et elle est durable, destinée à renforcer la compétitivité à long terme (structurelle).", "m": "m4"}, {"q": "Le policy mix désigne :", "o": ["la combinaison des politiques budgétaire et monétaire", "la répartition des dépenses publiques entre les ministères", "l'ensemble des réformes structurelles menées par un pays", "la coordination des politiques de concurrence en Europe"], "e": "Le policy mix est la combinaison de la politique budgétaire et de la politique monétaire : elles peuvent se renforcer ou se contrarier.", "m": "m3"}, {"q": "Pour un pays de la zone euro, le principal levier conjoncturel resté national est :", "o": ["la politique budgétaire", "la politique monétaire", "la politique de change", "la politique de taux d'intérêt"], "e": "Taux d'intérêt et taux de change relèvent désormais de la BCE et du marché. Le budget reste national, mais il est encadré par les règles européennes.", "m": "m6"}, {"q": "Le critère européen de référence pour la dette publique est fixé à :", "o": ["60 % du PIB", "3 % du PIB", "90 % du PIB", "100 % du PIB"], "e": "Les deux seuils de référence sont 3 % du PIB pour le déficit public (flux) et 60 % du PIB pour la dette publique (stock).", "m": "m6"}, {"q": "En France, une entente sur les prix entre entreprises concurrentes est sanctionnée par :", "o": ["l'Autorité de la concurrence", "la Banque centrale européenne", "la Cour des comptes", "le Conseil constitutionnel"], "e": "L'Autorité de la concurrence, autorité administrative indépendante, sanctionne les ententes et les abus de position dominante, jusqu'à 10 % du chiffre d'affaires mondial.", "m": "m5"}, {"q": "Une politique budgétaire discrétionnaire est :", "o": ["une décision explicite de l'État de modifier ses dépenses ou ses impôts", "une variation spontanée des recettes fiscales selon la conjoncture", "une décision de la BCE de modifier ses taux directeurs pour la zone", "une règle européenne qui limite le déficit public des États membres"], "e": "Elle résulte d'une décision (plan de relance, hausse d'impôt), à la différence des stabilisateurs automatiques qui jouent sans décision.", "m": "m2"}, {"q": "Une politique conjoncturelle se caractérise par :", "o": ["des mesures de court terme liées à la situation du moment", "des réformes durables qui transforment l'appareil productif", "des règles européennes qui fixent le niveau de la dette", "des aides réservées aux entreprises exportatrices du pays"], "e": "La politique conjoncturelle vise à corriger les déséquilibres du moment (relance, rigueur) ; la politique structurelle agit à long terme.", "m": "m4"}, {"q": "Une baisse des cotisations sociales salariales augmente d'abord :", "o": ["le salaire net, donc la demande des ménages", "le coût du travail supporté par l'employeur", "la compétitivité-prix des entreprises exportatrices", "les recettes de la sécurité sociale à court terme"], "e": "Les cotisations salariales sont prélevées sur le salaire : les baisser augmente le salaire net, donc le pouvoir d'achat. C'est une mesure de demande.", "m": "m4"}, {"q": "La procédure de clémence permet à une entreprise :", "o": ["d'obtenir une réduction d'amende en dénonçant une entente", "de fusionner avec un concurrent sans autorisation préalable", "de recevoir une aide de l'État sans contrôle européen", "de fixer librement les prix de revente de ses distributeurs"], "e": "Celui qui dénonce une entente à laquelle il a participé obtient une réduction, voire une exonération d'amende : les ententes deviennent instables.", "m": "m5"}, {"q": "Le contrôle des concentrations consiste à :", "o": ["autoriser ou interdire les fusions et rachats importants", "fixer le prix maximal des produits de première nécessité", "sanctionner les entreprises qui pratiquent des prix trop bas", "surveiller le niveau d'endettement des grandes entreprises"], "e": "Les fusions importantes doivent être autorisées ; elles peuvent être interdites si elles créent une position trop dominante (Alstom-Siemens, 2019).", "m": "m5"}, {"q": "Depuis 1999, pour un pays de la zone euro, dévaluer sa monnaie nationale est :", "o": ["impossible, car la monnaie est commune", "décidé par le gouvernement de chaque pays", "décidé chaque année par le Parlement européen", "autorisé en cas de déficit extérieur important"], "e": "La monnaie est l'euro, commune à 21 pays : un État ne peut plus dévaluer pour regagner en compétitivité.", "m": "m6"}], "games": [{"id": "g1", "titre": "Jeu 1 · La grille croisée : dans quelle case ?", "consigne": "Classe chaque mesure dans l'une des quatre cases. Le bouton « Vérifier » indique seulement le nombre d'erreurs.", "cats": ["Demande · conjoncturelle", "Offre · conjoncturelle", "Demande · structurelle", "Offre · structurelle"], "items": [["Plan de relance de 2020 finançant des travaux de rénovation énergétique", 0], ["Prime exceptionnelle versée une fois aux ménages modestes à la rentrée", 0], ["Hausse des taux directeurs de la BCE pour freiner le crédit en 2026", 0], ["Report de trois mois des cotisations sociales des entreprises en 2020", 1], ["Aide temporaire aux entreprises grandes consommatrices d'énergie", 1], ["Création d'une nouvelle prestation sociale versée de façon pérenne", 2], ["Revalorisation durable des minima sociaux au-delà de l'inflation", 2], ["Baisse pérenne de l'impôt sur les sociétés de 33,3 % à 25 %", 3], ["Plan d'investissement France 2030 dans l'innovation et l'industrie", 3], ["Renforcement durable de la formation professionnelle des salariés", 3]]}, {"id": "g2", "titre": "Jeu 2 · Quelle politique, dans quel sens ?", "consigne": "Identifie l'instrument (budgétaire ou monétaire) et l'orientation de chaque mesure.", "cats": ["Budgétaire · relance", "Budgétaire · stabilisation", "Monétaire · expansive", "Monétaire · restrictive"], "items": [["Hausse des dépenses d'investissement public", 0], ["Baisse de l'impôt sur le revenu des ménages", 0], ["Gel des dépenses de fonctionnement de l'État", 1], ["Hausse du taux normal de TVA", 1], ["Baisse du taux de la facilité de dépôt", 2], ["Achats massifs d'obligations par la BCE", 2], ["Hausse du taux des opérations principales de refinancement", 3], ["Arrêt des achats de titres et réduction du portefeuille de la BCE", 3]]}], "vf": [["Une crise est le moment de retournement entre une phase d'expansion et une phase de contraction.", true], ["Une politique de relance budgétaire réduit le déficit public.", false], ["La BCE peut recevoir des instructions des gouvernements de la zone euro.", false], ["Une hausse des taux d'intérêt peut entraîner une appréciation de l'euro.", true], ["Une baisse des cotisations patronales est une mesure de demande.", false], ["Le contrôle des concentrations peut conduire à interdire une fusion entre deux entreprises.", true], ["Depuis la réforme de 2024, le seuil de déficit public de 3 % du PIB a été supprimé.", false], ["La politique de la concurrence est une politique d'offre structurelle.", true]], "calcs": [{"id": "c1", "enonce": "L'inflation de la zone euro est passée de 3,2 % en août 2026 à 3,8 % en septembre 2026. De combien de <b>points de pourcentage</b> a-t-elle augmenté ?", "unite": "point(s)", "rep": 0.6, "tol": 0.01, "corr": "3,8 − 3,2 = <b>0,6 point de pourcentage</b>. On parle de « points » quand on compare deux taux exprimés en %."}, {"id": "c2", "enonce": "Le taux de dépôt de la BCE est passé de 2,00 % à 2,50 % entre juin 2025 et septembre 2026. Calcule son <b>taux de variation</b> (en %).", "unite": "%", "rep": 25, "tol": 0.1, "corr": "(2,50 − 2,00) / 2,00 × 100 = <b>+ 25 %</b>. Le taux a augmenté de 0,5 point, soit une hausse de 25 % : ne pas confondre les deux formulations."}, {"id": "c3", "enonce": "Le déficit public français est prévu à 5,4 % du PIB en 2026. De combien de points dépasse-t-il le critère européen ?", "unite": "point(s)", "rep": 2.4, "tol": 0.01, "corr": "5,4 − 3 = <b>2,4 points de PIB</b> au-dessus du seuil de référence de 3 %."}, {"id": "c4", "enonce": "Hypothèse simplifiée : le PIB d'un pays s'élève à 3 000 Md€ et son déficit public à 5 % du PIB. Calcule le montant du déficit (en Md€).", "unite": "Md€", "rep": 150, "tol": 0.5, "corr": "3 000 × 5 / 100 = <b>150 Md€</b>. Ce montant s'ajoute à la dette publique de l'année."}, {"id": "c5", "enonce": "Une dépense publique de 10 Md€ entraîne, grâce à l'effet multiplicateur, une hausse de la production de 14 Md€. Calcule la valeur du multiplicateur (production supplémentaire / dépense initiale).", "unite": "", "rep": 1.4, "tol": 0.01, "corr": "14 / 10 = <b>1,4</b> : chaque euro de dépense publique a généré 1,40 € de production supplémentaire."}], "lex": [["Fluctuations économiques", "Variations de court terme de l'activité autour de sa tendance de long terme."], ["Cycle économique", "Succession function setRadar(svg, vals, prev) {
  const g = AXES4.map((a, i) => { const an = -Math.PI / 2 + i * Math.PI / 2; return { x: Math.cos(an), y: Math.sin(an) }; });
  const from = prev || vals, t0 = performance.now();
  const stop = Anim.add(now => {
    const t = clamp((now - t0) / 800, 0, 1), e = 1 - Math.pow(1 - t, 3);
    const v = vals.map((x, i) => lerp(from[i], x, e)), pts = g.map((p, i) => [210 + p.x * v[i] * 1.45, 200 + p.y * v[i] * 1.45]);
    svg.querySelector(".shape").setAttribute("points", pts.map(p => p.join(",")).join(" "));

    if (t >= 1) stop();
  });
}

function countTo(el, to, d = 1, suffix = "", ms = 900) {
  const from = parseFloat(String(el.dataset.v ?? "0")) || 0; el.dataset.v = to; const t0 = performance.now();

      const { X, Y } = drawChart(cvs, [{ data: trend, c: C.dim, w: 1.5, dash: [7, 6] }, { data, c: C.cyan, w: 3.5, glow: true, area: "#4CC9E233" }], { xmin: 0, xmax: 12, ymin: -3.5, ymax: 6.5, yticks: [], xticks: [], left: 12, bottom: 12 });
      const ctx = cvs.getContext("2d"), y = f(T, mode);
      const lab = (x, txt, c, dy) => { ctx.font = '700 15px "Chakra Petch", sans-serif'; ctx.fillStyle = c; ctx.textAlign = "center"; ctx.fillText(txt, X(x), Y(f(x, mode)) + dy); };
      lab(.7, "Expansion", C.green, -22);
      if (step >= 1) lab(1.5, "Crise", C.coral, -26);
      if (step >= 2) { lab(3.2, "Récession", C.amber, -20); if (!mode) lab(4.5, "creux · reprise", C.mute, 30); }
      if (mode) lab(4.6, "Dépression", C.violet, 34);
      ctx.fillStyle = C.mute; ctx.font = '13px "Source Sans 3", sans-serif'; ctx.textAlign = "right"; ctx.fillText("tendance de long terme", X(11.8), Y(1 + 11.8 * .25) + 22);
      const pulse = step === 1 ? 6 + 4 * Math.sin(now / 160) : 0;
      ctx.fillStyle = C.amber; ctx.shadowColor = C.amber; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(X(T), Y(y), 9 + pulse / 3, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      if (step === 1) { ctx.strokeStyle = C.coral; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(X(T), Y(y), 20 + pulse * 2, 0, 6.283); ctx.stroke(); }
    });
    return { step(i) { step = i; mode = i === 3 ? 1 : 0; t0 = performance.now(); }, cleanup: stop };
  } },

{ id: "mission", p: 4, part: "IV · C", short: "Mission 2026", vt: "Tableau de bord · France 2026-2030",
  title: "Mission 2026 : pilotez la France jusqu'en 2030",
  question: "Vous êtes le gouvernement : chaque année, choisissez l'orientation du budget. La BCE, elle, décide seule.",

  steps: [["Votre mission", "Ramener le déficit vers 3 % du PIB d'ici 2029 sans casser la croissance ni l'emploi. Chaque année : relance, budget neutre ou rigueur. La BCE relève ses taux si l'inflation dépasse 3 %, les baisse si elle passe sous 2 %."]],
  ex: "Point de départ (2026, arrondis) : croissance 0,5 %, inflation 3 %, déficit 5,4 %, dette 119,3 % du PIB, taux de dépôt 2,50 %. Chômage : ordre de grandeur. Simulation pédagogique simplifiée.",
  retenir: "La politique budgétaire est le principal levier conjoncturel national, mais elle est contrainte : relancer creuse la dette, réduire le déficit freine la croissance. C'est l'arbitrage au cœur de la zone euro.",
  build(v, api) {
    const EVENTS = { 2027: ["Énergie encore chère", "Les prix de l'énergie restent élevés.", { en: .8, ext: 0 }], 2028: ["Détente énergétique", "Les prix de l'énergie reculent.", { en: -.6, ext: 0 }], 2029: ["Partenaires en ralentissement", "Les exportations ralentissent.", { en: 0, ext: -.4 }], 2030: ["Bilan", "Dernière année de la mission.", { en: 0, ext: 0 }] };
    const CH = [["Relance", 1.0], ["Budget neutre", 0], ["Rigueur", -1.0]];
    let s, hist, key = "def";
    const reset = () => { s = { y: 2026, g: .5, pi: 3.0, u: 7.5, def: 5.4, det: 119.3, r: 2.5 }; hist = [Object.assign({}, s)]; };
    reset();
    function stepModel(imp) { const e = EVENTS[s.y + 1][2], r = s.pi > 3 ? s.r + .25 : s.pi < 2 ? Math.max(1.5, s.r - .25) : s.r, g = 1.1 + .7 * imp - .35 * (r - 2) + e.ext, pi = .45 * s.pi + 1.1 + .25 * (g - 1.1) + e.en + .15 * imp, u = s.u - .45 * (g - 1.2), def = s.def + imp - .45 * (g - 1.1), det = s.det * (1 - (g + pi) / 100) + def; s = { y: s.y + 1, g, pi, u, def, det, r, choice: imp }; hist.push(Object.assign({}, s)); }
    v.innerHTML = `<div style="display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;height:100%"><div class="stack" style="gap:8px;min-height:0"><div class="seg js-seg"><button type="button" aria-pressed="true" data-k="def">Déficit</button><button type="button" aria-pressed="false" data-k="g">Croissance</button><button type="button" aria-pressed="false" data-k="u">Chômage</button><button type="button" aria-pressed="false" data-k="pi">Inflation</button></div>${cv('style="flex:1;min-height:180px"')}<div class="kpis js-k"></div></div><div class="stack js-r" style="gap:10px;min-height:0;overflow:auto"></div></div>`;
    $$(".js-seg button", v).forEach(bt => bt.onclick = () => { key = bt.dataset.k; $$(".js-seg button", v).forEach(x => x.setAttribute("aria-pressed", x === bt)); draw(); });
    const RANGE = { def: [0, 9, [0, 3, 6, 9], 3, "seuil 3 %"], g: [-1, 4, [-1, 0, 1, 2, 3, 4], null], u: [5, 10, [5, 6, 7, 8, 9, 10], null], pi: [0, 5, [0, 1, 2, 3, 4, 5], 2, "objectif 2 %"] };
    function draw() {
      const [a, z, ticks, line, ll] = RANGE[key];
      drawChart($("canvas", v), [{ data: hist.map(x => [x.y, x[key]]), c: C.green, w: 3.5, dots: true, glow: true, head: true, area: "#3FD69A33" }], { xmin: 2025.7, xmax: 2030.3, ymin: a, ymax: z, yticks: ticks, yfmt: q => q + " %", xticks: [2026, 2027, 2028, 2029, 2030], hlines: line != null ? [{ y: line, c: key === "def" ? C.coral : C.green, l: ll }] : [] });
      const k = (l, q, c) => `<div class="kpi" style="padding:8px 10px"><div class="l">${l}</div><div class="v" style="font-size:1.35rem;color:${c}">${q}</div></div>`;
      $(".js-k", v).innerHTML = k("Année", s.y, C.txt) + k("Croissance", fr(s.g) + " %", s.g < .5 ? C.coral : s.g < 1.2 ? C.amber : C.green) + k("Chômage", fr(s.u) + " %", s.u > 8 ? C.coral : s.u > 7 ? C.amber : C.green) + k("Inflation", fr(s.pi) + " %", Math.abs(s.pi - 2) > 1 ? C.coral : Math.abs(s.pi - 2) > .4 ? C.amber : C.green) + k("Déficit", fr(s.def) + " %", s.def > 3 ? C.coral : C.green) + k("Dette", fr(s.det) + " %", C.amber) + k("Taux BCE", fr(s.r, 2) + " %", C.cyan);
    }
    function ui() {
      draw(); const R = $(".js-r", v);
      if (s.y >= 2030) {

          <div class="exb"><span class="l">Débriefing</span><br>${ok ? "Le déficit a été réduit… au prix d'une croissance plus faible et d'un chômage plus élevé ?" : hist.some(x => x.choice > 0) ? "La relance a soutenu l'activité, mais la dette et le déficit restent élevés : la France resterait sous procédure." : "L'effort budgétaire n'a pas suffi : en freinant la croissance, il réduit aussi les recettes fiscales."}<br>Vos choix : ${hist.slice(1).map(x => `${x.y} ${CH.find(c => c[1] === x.choice)[0].toLowerCase()}`).join(" · ")}</div><button class="btn sm js-re" type="button">Recommencer la mission</button>`;
        $(".js-re", R).onclick = () => { reset(); if (api.mode === "present") api.clearAct(); ui(); }; return;

      const A = $(".js-a", R);

        $$("[data-i]", bt).forEach(x => x.onclick = () => { api.clearAct(); stepModel(CH[+x.dataset.i][1]); ui(); });
      } else {

  } },

/* Agrégation des réponses */
function aggregate(def, resp, manual) {
  const vals = [...resp.values()];
  if (def.kind === "poll") { const c = new Array(def.options.length).fill(0); vals.forEach(v => { if (v.choice >= 0 && v.choice < c.length) c[v.choice]++; }); (manual || []).forEach((x, i) => { if (i < c.length) c[i] += x; }); return { counts: c, total: c.reduce((a, b) => a + b, 0) }; }
  if (def.kind === "sort") { const items = def.items.map(() => new Array(def.options.length).fill(0)); vals.forEach(v => (v.choices || []).forEach((ch, i) => { if (items[i] && ch >= 0 && ch < def.options.length) items[i][ch]++; })); (manual || []).forEach((row, i) => row && row.forEach((x, j) => { if (items[i]) items[i][j] += x; })); return { items, total: Math.max(vals.length, ...(manual || []).map(r => r ? r.reduce((a, b) => a + b, 0) : 0), 0) }; }
  if (def.kind === "estimate") { const values = vals.map(v => v.value).filter(x => typeof x === "number" && isFinite(x)).concat(manual || []); const s = values.slice().sort((a, b) => a - b); return { values, total: values.length, median: s.length ? s[Math.floor((s.length - 1) / 2)] : null, mean: s.length ? s.reduce((a, b) => a + b, 0) / s.length : null }; }
  if (def.kind === "assign") { return { list: vals.filter(v => typeof v.k === "number").map(v => ({ k: v.k, choice: v.choice })), total: vals.length }; }
  return { total: 0 };
}

  if (def.kind === "poll") html += def.options.map((o, i) => `<div class="rbar ${revealed && def.answer === i ? "ok" : ""}"><span>${LETTERS[i]}. ${o}</span><div class="rt"><i style="width:${pct(agg.counts[i], agg.total)}%"></i></div><b>${pct(agg.counts[i], agg.total)} %</b></div>`).join("");

  if (def.kind === "estimate") html += histHTML(def, agg, revealed);
  box.innerHTML = html + (revealed && def.explain ? `<div class="expl">${def.explain}</div>` : "");
}
function histHTML(def, agg, revealed) {
  const B = 12, w = (def.max - def.min) / B, bins = new Array(B).fill(0);
  agg.values.forEach(v => { bins[clamp(Math.floor((v - def.min) / w), 0, B - 1)]++; });
  const mx = Math.max(1, ...bins), pos = x => 100 * (x - def.min) / (def.max - def.min);
  return `<div class="hist">${bins.map((b, i) => `<i style="height:${100 * b / mx}%"></i>`).join("")}${agg.median != null ? `<span class="hm" style="left:${pos(agg.median)}%"><em>médiane ${fr(agg.median, def.step < 1 ? 1 : 0)}</em></span>` : ""}${revealed && def.answer != null ? `<span class="ha" style="left:${pos(def.answer)}%"><em>réalité ${fr(def.answer, def.step < 1 ? 1 : 0)}</em></span>` : ""}</div><div class="hax"><span>${fr(def.min, 0)} ${def.unit}</span><span>${fr(def.max, 0)} ${def.unit}</span></div>`;
}

/* ------------------------------------------------------------------ Plan : fil d'Ariane */
function crumbParts(sc) {
  if (sc.isPart) return [["Partie " + PARTS[sc.p].n, "Plan de la partie"]];
  if (!sc.sec || !PARTS[sc.p]) return [[sc.sec || sc.part, sc.secT || ""]];
  const [rn, letter, num] = sc.sec.split(".");
  const P = PARTS[sc.p], s = P.secs.find(x => x[0] === letter);
  const out = [[rn + ".", P.t]];
  if (s) out.push([letter + ".", s[1]]);
  if (num) out.push([num + ".", sc.secT]);
  return out;
}
function crumbHTML(sc) { return crumbParts(sc).map(([a, b], i) => `${i ? '<i class="sep">›</i>' : ""}<span class="cr${i === crumbParts(sc).length - 1 ? " last" : ""}"><b>${a}</b> ${b}</span>`).join(""); }

  return "";
}
function wirePlayInput(el, def, send) {
  if (def.kind === "poll" || def.kind === "assign") $$(".s-opt", el).forEach(b => b.onclick = () => { $$(".s-opt", el).forEach(x => x.setAttribute("aria-pressed", x === b)); send(def.kind === "assign" ? { choice: +b.dataset.i, k: assignOf(def, pid()).k } : { choice: +b.dataset.i }); });

function feedbackHTML(def, me) {

      const def = Object.assign({}, a, { items: a.items ? a.items.map((t, i) => [t, a.sortAns ? a.sortAns[i] : null]) : null });
      const me = S.my[a.id];
      act = `<div class="s-card play-card" style="--pc:${col};border-color:${col}"><div class="kick" style="color:${col}">À toi de jouer · ${{ poll: "vote", sort: "classement", estimate: "estimation", assign: "jeu de rôle" }[a.kind]}</div><p class="disp" style="font-size:1.25rem;margin:.3em 0 .6em;text-wrap:balance">${a.q}</p>
        ${a.open ? `<div class="js-pin">${playInputHTML(def, me)}</div><p class="res ok">${me ? "Réponse envoyée. Tu peux la modifier tant que c'est ouvert." : ""}</p>` : a.reveal ? feedbackHTML(def, me) + (a.explain ? `<div class="expl">${a.explain}</div>` : "") : `<p class="muted">${me ? "Réponse enregistrée. Regarde l'écran : les réponses de la classe s'affichent." : "Les réponses sont closes. Regarde l'écran."}</p>`}</div>`;
    } else if (a.kind === "phrase") act = `<div class="s-card" style="border-color:${col}"><div class="kick">La phrase</div><p class="disp" style="font-size:1.2rem;margin:.3em 0">${a.q}</p>${a.open ? `<textarea id="sPh" maxlength="280" rows="4" placeholder="Ta réponse en une ou deux phrases…"></textarea><button class="btn pri" id="sPhGo" type="button" style="margin-top:10px;width:100%">Envoyer au mur</button><p class="res ok" id="sPhRes">${S.sentPhrase ? "Phrase envoyée. Tu peux en proposer une autre." : ""}</p>` : `<p class="muted">Le mur est fermé.</p>`}</div>`;
    else { const mine = S.my[a.id]; act = `<div class="s-card" style="border-color:${col}"><div class="kick" style="color:${col}">${a.kind === "cartel" ? "Décision secrète" : a.kind === "mission" ? "Vote de la classe" : "Question"}</div><p class="disp" style="font-size:1.25rem;margin:.3em 0 .6em;text-wrap:balance">${a.q}</p>${a.note ? `<p class="muted" style="margin-top:0">${a.note}</p>` : ""}
      ${a.options.map((o, i) => `<button class="s-opt legacy" type="button" data-i="${i}" aria-pressed="${mine === i}" ${a.open ? "" : "disabled"}><span class="L">${LETTERS[i]}</span><span>${o}</span></button>`).join("")}
      <p class="res ${a.reveal && a.correct != null ? (mine === a.correct ? "ok" : "ko") : ""}">${a.reveal && a.correct != null ? (mine === a.correct ? "Bonne réponse !" : `Réponse attendue : ${LETTERS[a.correct]}`) : a.open ? (mine != null ? "Réponse enregistrée. Tu peux encore changer." : "Choisis une réponse.") : "Vote clos."}</p>${a.explain ? `<div class="expl">${a.explain}</div>` : ""}</div>`; }
  }
  let live;
  if (!st) live = `<div class="s-card wait"><div class="pulse"></div><b>En attente du professeur…</b><p class="muted">Garde cette page ouverte.</p></div>`;
  else live = act + `<div class="s-card" style="--pc:${col}"><div class="crumb small">${esc(st.crumb || st.part)}</div><h2 class="disp" style="margin:.2em 0 .4em;font-size:1.3rem">${st.title}</h2>
      ${st.isPart ? "" : `<div class="tlab">Explication · étape ${st.step + 1} / ${st.n}</div><div class="st cur" style="cursor:default;--pc:${col}"><span class="n">${st.step + 1}</span><span class="t">${esc(st.stepTitle)}</span><span class="d">${esc(st.stepText)}</span></div>${st.meca ? `<div class="meca" style="--pc:${col}"><span class="ml">Mécanisme</span>${st.meca.map((t, k) => `${k ? '<i class="ar">→</i>' : ""}<span class="mk">${esc(t)}</span>`).join("")}</div>` : ""}${st.warn ? `<div class="warn"><b>Attention</b><span>${esc(st.warn)}</span></div>` : ""}`}
      ${(st.defs || []).length ? `<div class="tlab">✎ Définitions à recopier</div>` : ""}${(st.defs || []).map(([t, d, off]) => `<div class="dcard" style="--pc:${col};margin-top:8px"><div class="dt">${off ? '<span class="off">Programme</span>' : ""}<span>${esc(t)}</span></div><div class="dd">${esc(d)}</div></div>`).join("")}
      ${st.retenir ? `<div class="tlab">✎ À retenir</div><div class="ret" style="--pc:${col}"><p>${esc(st.retenir)}</p></div>` : ""}</div>`;
  const nb = Object.keys(S.course || {}).length;
  root.innerHTML = `<div class="s-head"><span class="kick">Séance ${esc(S.code)} · ${esc(S.name)}</span><span style="flex:1"></span>${conn}</div>
    <div class="stabs"><button type="button" data-t="live" aria-selected="${S.tab === "live"}">En direct${st && st.act && st.act.open ? ' <span class="pip"></span>' : ""}</button><button type="button" data-t="course" aria-selected="${S.tab === "course"}">Mon cours · ${nb} section${nb > 1 ? "s" : ""}</button></div>
    ${S.tab === "live" ? live : courseHTML()}`;
  $$(".stabs button", root).forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderStudent(); });
  if (S.tab !== "live") return;
  const pin = $(".js-pin", root);
  if (pin && st.act.isPlay) { const a = st.act, def = Object.assign({}, a, { items: a.items ? a.items.map(t => [t, null]) : null }); wirePlayInput(pin, def, payload => { S.my[a.id] = payload; S.live.send("answer", Object.assign({ act: a.id }, payload)); renderStudent(); }); }
  $$(".s-opt.legacy", root).forEach(b => b.onclick = () => { const i = +b.dataset.i; S.my[st.act.id] = i; S.live.send("answer", { act: st.act.id, choice: i }); renderStudent(); });
  const pg = $("#sPhGo"); if (pg) pg.onclick = () => { const t = $("#sPh").value.trim(); if (t.length < 8) { $("#sPhRes").textContent = "Écris au moins une phrase complète."; $("#sPhRes").className = "res ko"; return; } S.live.send("phrase", { act: st.act.id, text: t }); S.sentPhrase = 1; renderStudent(); };
}

document.addEventListener("DOMContentLoaded", initHome);

</script>
</body>
</html>
